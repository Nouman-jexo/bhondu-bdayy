name: Send Daily Push Notification

on:
  schedule:
    # This is set to 07:00 UTC, which equals exactly 12:00 PM PKT (Noon)
    # Change the "7" to whatever UTC hour you want.
    - cron: '0 7 * * *'
  
  # This line is critical: It adds a "Run workflow" button in GitHub 
  # so you can manually test this exact script anytime you want!
  workflow_dispatch: 

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OneSignal API
        run: |
          curl --request POST \
            --url 'https://onesignal.com/api/v1/notifications' \
            --header 'Authorization: Basic ${{ secrets.ONESIGNAL_REST_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data '{
              "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
              "included_segments": ["Subscribed Users"],
              "headings": {"en": "Ready for some love?"},
              "contents": {"en": "Your daily dose of love is waiting. Tap to see what we’ve got!"},
              "url": "https://bhondu-bdayy.vercel.app/"
            }'
