name: Send Daily Push Notification

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OneSignal API
        run: |
          curl -X POST "https://onesignal.com/api/v1/notifications" \
            -H "Authorization: Basic ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "app_id": "705d6671-3343-4e8f-a4f5-b1a7214de2f0",
              "included_segments": ["Subscribed Users"],
              "headings": {"en": "Ready for some love?"},
              "contents": {"en": "Your daily dose of love is waiting. Tap to see what we’ve got!"},
              "url": "https://bhondu-bdayy.vercel.app/"
            }'
